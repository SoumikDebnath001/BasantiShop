name: Continuous Deployment (Prod)

on:
    push:
        branches:
            - main

jobs:
    build-and-deploy:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Docker login
              uses: docker/login-action@v3
              with:
                  username: ${{ secrets.DOCKER_USERNAME }}
                  password: ${{ secrets.DOCKER_TOKEN }}

            - name: Build and push backend
              uses: docker/build-push-action@v6
              with:
                  context: ./Backend
                  push: true
                  tags: |
                      ${{ secrets.DOCKER_USERNAME }}/basanti-shop-backend:${{ github.sha }}
                      ${{ secrets.DOCKER_USERNAME }}/basanti-shop-backend:latest
                  cache-from: type=gha,scope=backend
                  cache-to: type=gha,mode=max,scope=backend

            - name: Build and push frontend
              uses: docker/build-push-action@v6
              with:
                  context: ./frontend
                  push: true
                  tags: |
                      ${{ secrets.DOCKER_USERNAME }}/basanti-shop-frontend:${{ github.sha }}
                      ${{ secrets.DOCKER_USERNAME }}/basanti-shop-frontend:latest
                  build-args: |
                      VITE_API_BASE_URL=${{ secrets.VITE_API_BASE_URL }}
                  cache-from: type=gha,scope=frontend
                  cache-to: type=gha,mode=max,scope=frontend

            - name: Run database migrations
              working-directory: ./Backend
              run: |
                  npm ci
                  npx prisma migrate deploy
              env:
                  DATABASE_URL: ${{ secrets.DATABASE_URL }}

            - name: Deploy to production
              uses: appleboy/ssh-action@v1.0.3
              with:
                  host: ${{ secrets.SSH_HOST }}
                  username: ${{ secrets.SSH_USER }}
                  key: ${{ secrets.SSH_PRIVATE_KEY }}
                  script: |
                      set -e
                      cd /var/www/basanti-shop
                      export DOCKER_USERNAME=${{ secrets.DOCKER_USERNAME }}
                      docker compose --env-file .env -f docker-compose.yml pull
                      docker compose --env-file .env -f docker-compose.yml up -d --force-recreate
                      docker image prune -f

            - name: Health check
              uses: appleboy/ssh-action@v1.0.3
              with:
                  host: ${{ secrets.SSH_HOST }}
                  username: ${{ secrets.SSH_USER }}
                  key: ${{ secrets.SSH_PRIVATE_KEY }}
                  script: |
                      for i in $(seq 1 15); do
                        if curl -sf http://localhost:8000/health > /dev/null; then
                          echo "Backend healthy after $((i * 5))s"; exit 0
                        fi
                        echo "Waiting for backend... ($i/15)"
                        sleep 5
                      done
                      echo "Backend failed to become healthy" && exit 1
